name: Build and verify

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliefmesh-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Type, test, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Verify production build
        run: npm run verify:ci

  e2e:
    name: PostgreSQL incident lifecycle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reliefmesh
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reliefmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliefmesh?schema=public
      AUTH_SECRET: reliefmesh-ci-auth-secret-at-least-32-characters
      GUARDIAN_DEVICE_API_SECRET: reliefmesh-ci-guardian-secret-at-least-32-characters
      GUARDIAN_REPORTER_EMAIL: citizen@reliefmesh.test
      PW_START_SERVER: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Seed isolated test data
        run: npm run prisma:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end workflows
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
