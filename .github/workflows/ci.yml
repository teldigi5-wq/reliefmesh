name: Build and verify

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliefmesh-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  FLUTTER_VERSION: "stable"
  MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://reliefmesh-theta.vercel.app' }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || '' }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID || '' }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || '' }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Type, test, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install web dependencies
        run: npm ci

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify production build
        run: npm run verify:ci

      - name: Validate Firebase mobile configuration
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "::error::FIREBASE_API_KEY is missing"; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo "::error::FIREBASE_ANDROID_APP_ID is missing"; exit 1; }
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::FIREBASE_MESSAGING_SENDER_ID is missing"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::FIREBASE_PROJECT_ID is missing"; exit 1; }

      - name: Build installable Android APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ env.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ env.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}

      - name: Upload ReliefMesh Android app
        uses: actions/upload-artifact@v4
        with:
          name: reliefmesh-android-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: PostgreSQL incident lifecycle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reliefmesh
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reliefmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliefmesh?schema=public
      AUTH_SECRET: reliefmesh-ci-auth-secret-at-least-32-characters
      GUARDIAN_DEVICE_API_SECRET: reliefmesh-ci-guardian-secret-at-least-32-characters
      GUARDIAN_REPORTER_EMAIL: citizen@reliefmesh.test
      PW_START_SERVER: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Seed isolated test data
        run: npm run prisma:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end workflows
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
